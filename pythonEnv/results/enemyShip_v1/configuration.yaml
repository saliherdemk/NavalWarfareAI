default_settings: null
behaviors:
  EnemyShip:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 500000
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 10000000
    time_horizon: 1024
    summary_freq: 10000
    threaded: false
    self_play: null
    behavioral_cloning: null
env_settings:
  env_path: Builds/EnemySolo/game.x86_64
  env_args: null
  base_port: 5005
  num_envs: 4
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 40.0
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
  no_graphics_monitor: false
environment_parameters:
  player_speed_multiplier:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 416
          value: 1
      name: Fast
      completion_criteria: null
  difficulty:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 417
          value: 1
      name: Phase0_Close_NoWalls
      completion_criteria:
        behavior: EnemyShip
        measure: reward
        min_lesson_length: 100
        signal_smoothing: true
        threshold: 0.9
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 418
          value: 1
      name: Phase2_Medium_FewWalls
      completion_criteria:
        behavior: EnemyShip
        measure: reward
        min_lesson_length: 100
        signal_smoothing: true
        threshold: 0.8
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 419
          value: 2
      name: Phase3_Medium_ManyWalls
      completion_criteria:
        behavior: EnemyShip
        measure: reward
        min_lesson_length: 100
        signal_smoothing: true
        threshold: 0.8
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 420
          value: 3
      name: Phase4_Far_ManyWalls
      completion_criteria: null
checkpoint_settings:
  run_id: enemyShip_v1
  initialize_from: null
  load_model: false
  resume: true
  force: false
  train_model: false
  inference: false
  results_dir: results
torch_settings:
  device: null
debug: false
