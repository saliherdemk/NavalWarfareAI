
behaviors:
  PlayerShip:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    time_horizon: 512
    max_steps: 20_000_000
    summary_freq: 100_000

environment_parameters:
  enemy_speed_multiplier:
    curriculum:
      - name: FreezeEnemy
        value: 0.0
  map_level:
    curriculum:
      - name: Intro_Sandbox
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          threshold: 0.1
        value: 16.0
      - name: Walls_Added
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          threshold: 0.6
        value: 8.0
      - name: Full
        value: 4.0

  spawn_radius:
    curriculum:
      - name: Close_Range
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          threshold: 0.2
        value: 30.0
      - name: Medium_Range
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          threshold: 0.5
        value: 60.0
      - name: Long_Range
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          threshold: 0.8
        value: 150.0
      - name: Infinite
        value: -1.0

  distance_reward_weight:
    curriculum:
      - name: Full_Help
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          threshold: 0.3
        value: 1.0
      - name: Less_Help
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          threshold: 0.6
        value: 0.5
      - name: Minimal_Help
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          threshold: 0.9
        value: 0.1
      - name: No_Help
        value: 0.05
