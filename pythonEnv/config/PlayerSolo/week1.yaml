
behaviors:
  PlayerShip:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    time_horizon: 512
    max_steps: 20_000_000 
    summary_freq: 20_000

  EnemyShip:
    trainer_type: ppo 

    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    
    time_horizon: 512
    max_steps: 5_000_000 
    summary_freq: 20_000

environment_parameters:
  enemy_speed_multiplier:
    curriculum:
      - name: FreezeEnemy
        value: 0.0

  map_level:
    curriculum:
      - name: Easy
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          signal_smoothing: true
          min_lesson_length: 2000
          threshold: 0.15
        value: 16.0

      - name: Medium
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          signal_smoothing: true
          min_lesson_length: 3000
          threshold: 0.15
        value: 8.0

      - name: Normal
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          signal_smoothing: true
          min_lesson_length: 4000
          threshold: 0.15
        value: 4.0

      - name: Hard
        value: 2.0

  spawn_radius:
    curriculum:
      - name: Small 
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.1
        value: 30.0
      
      - name: Medium
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.3
        value: 60.0

      - name: Large
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 150.0

      - name: Full
        value: -1.0
