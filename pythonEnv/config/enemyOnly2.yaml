behaviors:
  EnemyShip:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    
    reward_signals:
      extrinsic:
        gamma: 0.99  # Slightly reduced for faster credit assignment
        strength: 1.0
    
    time_horizon: 512  # Reduced for better learning signal
    max_steps: 10_000_000
    summary_freq: 10_000
 
environment_parameters:
  # PHASE-BASED CURRICULUM
  training_phase:
    curriculum:
      # PHASE 1: Learn to pursue (1-3M steps)
      - name: Phase1_BasicPursuit
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 1.5  # INCREASED - must actually master pursuit
          min_lesson_length: 200  # INCREASED - more episodes to prove it
          signal_smoothing: true
        value: 0  # TrainingPhase.BasicPursuit
      
      # PHASE 2: Learn to intercept (3-6M steps)
      - name: Phase2_PathInterception
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 2.0  # INCREASED - must master interception
          min_lesson_length: 200
          signal_smoothing: true
        value: 1  # TrainingPhase.PathInterception
      
      # PHASE 3: Learn tactics (6M+ steps)
      - name: Phase3_AdvancedTactics
        value: 2  # TrainingPhase.AdvancedTactics

  # MAP COMPLEXITY (coordinate with training phase)
  difficulty:
    curriculum:
      # Start simple: small maps, no walls
      - name: SmallMap_NoWalls
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 1.5  # INCREASED
          min_lesson_length: 200  # INCREASED
          signal_smoothing: true
        value: 0  # Small training radius, few walls
      
      # Medium maps during interception learning
      - name: MediumMap_SomeWalls
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 2.0  # INCREASED
          min_lesson_length: 200  # INCREASED
          signal_smoothing: true
        value: 1  # Medium radius, some walls
      
      # Medium-large maps (ADD INTERMEDIATE STEP)
      - name: LargeMap_SomeWalls
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 1.5
          min_lesson_length: 200
          signal_smoothing: true
        value: 2  # Large radius, walls
      
      # Full complexity for advanced tactics
      - name: LargeMap_FullComplexity
        value: 3  # Full sized maps with walls

  # PLAYER DIFFICULTY (easier -> harder)
  player_speed_multiplier:
    curriculum:
      # Slow player during basic pursuit
      - name: SlowPlayer
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 1.5  # INCREASED
          min_lesson_length: 200  # INCREASED
          signal_smoothing: true
        value: 0.6
      
      # Medium speed during interception
      - name: MediumPlayer
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 2.0  # INCREASED
          min_lesson_length: 200  # INCREASED
          signal_smoothing: true
        value: 0.8
      
      # Full speed for advanced tactics
      - name: FastPlayer
        value: 1.0

  # Enemy starting position (affects shortcut learning)
  enemy_spawn_radius:
    curriculum:
      # Start close to player
      - name: CloseSpawn
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 1.5  # INCREASED
          min_lesson_length: 200
        value: 30
      
      # Medium distance (forces path planning)
      - name: MediumSpawn
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 2.0  # INCREASED
          min_lesson_length: 200
        value: 60
      
      # Farther spawns (requires shortcuts)
      - name: FarSpawn
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 1.5
          min_lesson_length: 200
        value: 100
      
      # Variable spawn (must handle all scenarios)
      - name: VariableSpawn
        value: -1  # Random spawn anywhere
