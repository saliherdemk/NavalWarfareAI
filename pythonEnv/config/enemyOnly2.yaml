behaviors:
  EnemyShip:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 2.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    time_horizon: 1024
    max_steps: 15_000_000
    summary_freq: 10_000
 
environment_parameters:
  player_speed_multiplier:
    curriculum:
      - name: Fast
        value: 1
      
  difficulty:
    curriculum:
      - name: Phase0_Close_NoWalls
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 0.9
          min_lesson_length: 100
          signal_smoothing: true
        value: 1

      - name: Phase2_Medium_FewWalls
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 0.8
          min_lesson_length: 100
          signal_smoothing: true
        value: 1

      - name: Phase3_Medium_ManyWalls
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 0.8
          min_lesson_length: 100
          signal_smoothing: true
        value: 2

      - name: Phase4_Far_ManyWalls
        value: 3

