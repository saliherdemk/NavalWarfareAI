behaviors:
  EnemyShip:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    
    reward_signals:
      extrinsic:
        gamma: 0.99  
        strength: 1.0
    
    time_horizon: 512  
    max_steps: 10_000_000
    summary_freq: 10_000
 
environment_parameters:
  training_phase:
    curriculum:
      - name: Phase1_BasicPursuit
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 1.5  
          min_lesson_length: 200  
          signal_smoothing: true
        value: 0  
      
      - name: Phase2_PathInterception
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 2.0  
          min_lesson_length: 200
          signal_smoothing: true
        value: 1  
      
      - name: Phase3_AdvancedTactics
        value: 2  

 
  player_speed_multiplier:
    curriculum:
      - name: SlowPlayer
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 1.5  
          min_lesson_length: 200  
          signal_smoothing: true
        value: 0.6
      
      - name: MediumPlayer
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 2.0 
          min_lesson_length: 200 
          signal_smoothing: true
        value: 0.8
      
      - name: FastPlayer
        value: 1.0

