behaviors:
  EnemyShip:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 4  
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    
    reward_signals:
      extrinsic:
        gamma: 0.99  
        strength: 1.0
    
    time_horizon: 1024  
    max_steps: 50_000_000  
    summary_freq: 10_000
 
environment_parameters:
  enemy_difficulty:
    curriculum:
      - name: SmallFreeze
        value: 0
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 2.5 
          min_lesson_length: 500 
          signal_smoothing: true
          require_reset: false
      
      - name: MediumFreeze
        value: 1
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 2.0  
          min_lesson_length: 750
          signal_smoothing: true
          require_reset: false
      
      - name: LargeFreeze
        value: 2
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 1.5
          min_lesson_length: 1000
          signal_smoothing: true
