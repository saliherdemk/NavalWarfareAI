behaviors:
  PlayerShip:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 2.0e-2
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 4
    
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    time_horizon: 1024
    max_steps: 101_000_000
    summary_freq: 100_000
 
environment_parameters:
  player_phase:
    curriculum:
      - name: phase1
        value: 1


