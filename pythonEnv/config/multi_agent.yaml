behaviors:
  PlayerShip:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    time_horizon: 512
    max_steps: 10_000_000 
    summary_freq: 20_000

  EnemyShip:
    trainer_type: ppo 
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 64
    summary_freq: 20000

environment_parameters:
  
  player_speed_multiplier:
    curriculum:
      - name: SittingDuck
        completion_criteria:
          measure: progress
          behavior: EnemyShip
          threshold: 0.1
        value: 0.0
      
      - name: SlowTarget
        completion_criteria:
          measure: progress
          behavior: EnemyShip
          threshold: 0.3
        value: 0.3

      - name: FastTarget
      value: 1.0

  spawn_radius:
    curriculum:
      - name: Lesson0 
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.1
        value: 30.0
      
      - name: Lesson1 
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.3
        value: 60.0

      - name: Lesson2
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 150.0

      - name: Lesson3
        value: -1.0
