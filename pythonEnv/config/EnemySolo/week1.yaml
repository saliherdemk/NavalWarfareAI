behaviors:
  PlayerShip:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    time_horizon: 1024
    max_steps: 5_000_000
    summary_freq: 10_000

  EnemyShip:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 1.0e-2 
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      # memory:
      #   sequence_length: 64
      #   memory_size: 128
    
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    
    time_horizon: 1024
    max_steps: 100_000_000 
    summary_freq: 10_000

environment_parameters:
  player_speed_multiplier:
    curriculum:
      - name: Freeze
        value: 0

  enemy_speed_multiplier:
    curriculum:
      - name: FullSpeed
        value: 1.0 
      
  difficulty:
    curriculum:
      - name: Phase2_Medium_FewWalls
        completion_criteria:
          measure: reward
          behavior: EnemyShip 
          threshold: 0.4
          min_lesson_length: 200
          signal_smoothing: true
        value: 1

      - name: Phase3_Medium_ManyWalls
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 0.5
          min_lesson_length: 200
          signal_smoothing: true
        value: 2

      - name: Phase4_Far_ManyWalls
        value: 3

  enemy_spawn_radius:
    curriculum:
      - name: Phase0_CloseCombat
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 0.5
          min_lesson_length: 100
        value: 30.0

      - name: Phase2_MidRange
        completion_criteria:
          measure: reward
          behavior: EnemyShip
          threshold: 0.6
          min_lesson_length: 100
        value: 60.0

      - name: Phase3_Global
        value: -1.0
