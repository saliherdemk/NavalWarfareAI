behaviors:
  PlayerShip:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: constant
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        encoding_size: 64
    
    self_play:
      save_steps: 20000
      swap_steps: 50000
      window: 15
      play_against_latest_model_ratio: 0.1 
      initial_elo: 1200.0
    
    time_horizon: 512
    max_steps: 30_000_000
    summary_freq: 10_000
  
  EnemyShip:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: constant
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    
    self_play:
      save_steps: 30000
      swap_steps: 40000
      window: 10
      play_against_latest_model_ratio: 0.3
      initial_elo: 1200.0
    
    time_horizon: 512
    max_steps: 30_000_000
    summary_freq: 10_000

environment_parameters:
  training_phase:
    curriculum:
      - name: AdvancedTactics
        value: 2
  difficulty:
    curriculum:
      # - name: MediumComplexity
      #   completion_criteria:
      #     measure: reward
      #     behavior: PlayerShip
      #     threshold: 1.0
      #     min_lesson_length: 200
      #   value: 1
      
      - name: FullComplexity
        value: 3
  
  player_speed_multiplier:
    curriculum:
      - name: FastPlayer
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          threshold: 0.3  
          min_lesson_length: 500
          signal_smoothing: true
        value: 1.25
      
      - name: SlightlyFastPlayer
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          threshold: 0.4
          min_lesson_length: 500
        value: 1.15
      
      - name: EqualSpeed
        value: 1.0
  
  enemy_speed_multiplier:
    curriculum:
      - name: SlowerEnemy
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          threshold: 0.3
          min_lesson_length: 500
        value: 0.8
      
      - name: NormalEnemy
        value: 1.0
