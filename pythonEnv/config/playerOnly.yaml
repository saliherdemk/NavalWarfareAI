behaviors:
  PlayerShip:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    time_horizon: 1024
    max_steps: 10_000_000
    summary_freq: 10_000
 
environment_parameters:
  player_phase0:
    curriculum:
      - name: phase0
        value: 1

  enemy_speed_multiplier:
    curriculum:
      - name: Freeze
        value: 0
      
  difficulty:
    curriculum:
      - name: NoWalls
        completion_criteria:
          measure: reward
          behavior: PlayerShip
          threshold: 4.0
          min_lesson_length: 100
          signal_smoothing: true
        value: 0

      - name: FewWalls
        completion_criteria:
          measure: reward
          behavior: PlayerShip
          threshold: 4.0
          min_lesson_length: 100
          signal_smoothing: true
        value: 1

      - name: ManyWalls
        value: 2

