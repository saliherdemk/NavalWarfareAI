behaviors:
  PlayerShip:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 7.5e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    time_horizon: 1024
    max_steps: 20_000_000
    summary_freq: 10_000
 
environment_parameters:
  enemy_speed_multiplier:
    curriculum:
      - name: VerySlow
        completion_criteria:
          measure: reward
          behavior: PlayerShip
          threshold: 4.0
          min_lesson_length: 300
        value: 0.5

      - name: Medium
        completion_criteria:
          measure: reward
          behavior: PlayerShip
          threshold: 4.0
          min_lesson_length: 300
        value: 0.75

      - name: Fast
        value: 1.0
      
  difficulty:
    curriculum:
      - name: ManyWalls
        value: 2

