behaviors:
  PlayerShip:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 3

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    time_horizon: 512
    max_steps: 3_000_000
    summary_freq: 10_000

environment_parameters:
  spawn_radius:
    curriculum:
      - name: Lesson0 
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.1
        value: 30.0
      
      - name: Lesson1 
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.3
        value: 60.0

      - name: Lesson2
        completion_criteria:
          measure: progress
          behavior: PlayerShip
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 150.0

      - name: Lesson3
        value: -1.0
